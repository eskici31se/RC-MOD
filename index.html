<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mining Pro - v21 Profiles</title>
    <style>
        :root { --bg: #0b0b1a; --card: #16162d; --accent: #00f2ff; --danger: #ff4d4d; --edit: #f59e0b; --text: #e0e0e0; --success: #22c55e; --manual: #a855f7; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        .header-stats { height: 65px; background: rgba(11, 11, 26, 0.95); display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid var(--accent); }
        .stat-box { text-align: center; }
        .stat-label { font-size: 9px; color: #888; }
        .stat-val { font-size: 11px; font-weight: bold; color: var(--accent); display: block; }

        .container { display: flex; flex-direction: column; height: calc(100% - 67px); padding: 12px; box-sizing: border-box; gap: 8px; }

        .top-panel { flex-shrink: 0; background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid #2d2d4d; }
        
        /* Aktif Mod Göstergesi */
        .mode-indicator { text-align: center; font-size: 10px; font-weight: bold; margin-bottom: 8px; padding: 4px; border-radius: 4px; letter-spacing: 1px; }
        .mode-optimum { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .mode-power { background: rgba(245, 158, 11, 0.2); color: var(--edit); border: 1px solid var(--edit); }
        .mode-manual { background: rgba(168, 85, 247, 0.2); color: var(--manual); border: 1px solid var(--manual); }

        .strategy-bar { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-strat { flex: 1; height: 45px; border-radius: 8px; border: none; font-size: 18px; cursor: pointer; color: white; opacity: 0.5; transition: 0.3s; }
        .btn-strat.active { opacity: 1; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid white; }
        
        .btn-auto { background: var(--success); }
        .btn-power { background: var(--edit); }
        .btn-manual { background: var(--manual); }

        input, select { width: 100%; padding: 8px; margin: 4px 0; border-radius: 6px; border: 1px solid #333; background: #050510; color: white; font-size: 13px; box-sizing: border-box; }
        
        #invWrapper { display: none; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .inv-container { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        
        .scroll-area { flex-grow: 1; overflow-y: auto; padding-right: 5px; scrollbar-width: thin; }
        .shelf { background: #1a1a35; border-radius: 10px; padding: 10px; margin-bottom: 12px; border: 1px solid #333; }
        .shelf-title { font-size: 11px; color: #fbbf24; margin-bottom: 6px; display: flex; justify-content: space-between; font-weight: bold; }
        .floor { height: 40px; background: #08081a; margin: 3px 0; border-radius: 4px; display: flex; gap: 3px; padding: 2px; }
        .slot { flex: 1; background: #2a2a4d; border-radius: 3px; display: flex; flex-direction: column; justify-content: center; padding: 0 5px; border: 1px solid #3d3d5d; position: relative; overflow: hidden; }
        .slot.double { flex: 2; border-color: var(--accent); }
        .m-name-mini { font-size: 9px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .m-stats-mini { font-size: 8px; color: var(--accent); }
        .btn-remove-mini { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: var(--danger); background: none; border: none; font-size: 18px; cursor: pointer; }

        .room-nav { display: flex; gap: 5px; overflow-x: auto; flex-shrink: 0; padding-bottom: 5px; }
        .room-btn { padding: 8px 12px; background: #242444; border-radius: 6px; font-size: 10px; cursor: pointer; border: 1px solid #333; color: #888; }
        .room-btn.active { background: var(--accent); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-stats">
        <div class="stat-box"><span class="stat-label">HAM GÜÇ</span><span id="pPower" class="stat-val">-</span></div>
        <div class="stat-box"><span class="stat-label">UNIQUE BONUS</span><span id="pBonus" class="stat-val">%0.000</span></div>
        <div class="stat-box"><span class="stat-label">NET GÜÇ</span><span id="pFinal" class="stat-val">-</span></div>
    </div>

    <div class="container">
        <div class="top-panel">
            <div id="modeLabel" class="mode-indicator mode-manual">MANUEL YERLEŞTİRME MODU</div>
            
            <div class="strategy-bar">
                <button id="btn-opt" class="btn-strat btn-auto" onclick="switchMode('optimum')">🚀</button>
                <button id="btn-pwr" class="btn-strat btn-power" onclick="switchMode('power')">💪</button>
                <button id="btn-man" class="btn-strat btn-manual active" onclick="switchMode('manual')">✍️</button>
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
                <select id="selMiner" style="flex: 2;"></select>
                <select id="selShelf" style="flex: 1;"></select>
                <button onclick="place()" style="width: 45px; height: 35px; background:#5d3fd3; color:white; border:none; border-radius:8px; font-weight:bold;">+</button>
                <button onclick="toggleInv()" style="width: 45px; height: 35px; background:var(--card); color:white; border:1px solid #444; border-radius:8px;">📦</button>
            </div>
            
            <div id="invWrapper">
                <div id="invList" class="inv-container" style="margin-bottom:10px;"></div>
                <div style="border-top:1px solid #333; padding-top:10px;">
                    <input type="text" id="mName" placeholder="Madenci İsmi">
                    <div style="display: flex; gap: 5px;">
                        <input type="number" step="0.001" id="mPower" placeholder="Güç">
                        <input type="number" step="0.001" id="mBonus" placeholder="Bonus %">
                        <select id="mType" style="width: 80px;"><option value="1">1H</option><option value="2">2H</option></select>
                    </div>
                    <button style="background:var(--accent); color:black; width:100%; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="addInv()">ENVANTERE YENİ KAYIT EKLE</button>
                </div>
            </div>
        </div>

        <div class="room-nav" id="roomNav"></div>
        <div id="roomView" class="scroll-area"></div>
        <button style="background:none; border:none; color:#444; font-size:9px; cursor:pointer;" onclick="resetAll()">SİSTEMİ SIFIRLA</button>
    </div>

<script>
    let activeMode = 'manual';
    let inventory = JSON.parse(localStorage.getItem('m_v21_inv')) || [];
    let roomSizes = [12, 18, 18, 18];
    
    // 3 Farklı Slot İçin Tesis Verisi
    let facilities = JSON.parse(localStorage.getItem('m_v21_facs')) || {
        manual: createEmptyFacility(),
        optimum: createEmptyFacility(),
        power: createEmptyFacility()
    };

    function createEmptyFacility() {
        return roomSizes.map(size => Array.from({length: size}, (_, i) => ({name: `Raf ${i+1}`, bonus: 0, floors: [[],[],[],[]]})));
    }

    function switchMode(mode) {
        activeMode = mode;
        
        // UI Güncelleme
        document.querySelectorAll('.btn-strat').forEach(b => b.classList.remove('active'));
        const label = document.getElementById('modeLabel');
        label.className = "mode-indicator mode-" + mode;
        
        if(mode === 'optimum') {
            document.getElementById('btn-opt').classList.add('active');
            label.innerText = "🚀 OPTİMUM BONUS MODU";
            runAutoLogic('bonus');
        } else if(mode === 'power') {
            document.getElementById('btn-pwr').classList.add('active');
            label.innerText = "💪 MAKSİMUM GÜÇ MODU";
            runAutoLogic('power');
        } else {
            document.getElementById('btn-man').classList.add('active');
            label.innerText = "✍️ MANUEL YERLEŞTİRME MODU";
        }
        
        currentRoom = 0;
        updateUI();
        render();
        calculate();
    }

    function runAutoLogic(type) {
        let fac = facilities[type];
        fac.forEach(room => room.forEach(shelf => shelf.floors = [[],[],[],[]]));
        
        let minerPool = [...inventory].sort((a, b) => b.power - a.power);
        let allShelves = [];
        fac.forEach((room, rIdx) => {
            room.forEach((shelf, sIdx) => { allShelves.push({ rIdx, sIdx, bonus: shelf.bonus }); });
        });

        if (type === 'bonus') allShelves.sort((a, b) => b.bonus - a.bonus);

        for (let shelfInfo of allShelves) {
            let shelf = fac[shelfInfo.rIdx][shelfInfo.sIdx];
            for (let f = 0; f < 4; f++) {
                let capacity = 2;
                for (let i = 0; i < minerPool.length; i++) {
                    if (minerPool[i].size <= capacity) {
                        shelf.floors[f].push({ ...minerPool[i], instId: Date.now() + Math.random() });
                        capacity -= minerPool[i].size;
                        minerPool.splice(i, 1);
                        i--;
                        if (capacity <= 0) break;
                    }
                }
            }
        }
        save();
    }

    function formatPower(val) {
        if (!val || val === 0) return "0.000 TH";
        const units = ["TH", "PH", "EH", "ZH"];
        let i = 0;
        while (val >= 1000 && i < units.length - 1) { val /= 1000; i++; }
        return val.toFixed(3) + " " + units[i];
    }

    function save() {
        localStorage.setItem('m_v21_inv', JSON.stringify(inventory));
        localStorage.setItem('m_v21_facs', JSON.stringify(facilities));
        calculate();
    }

    function calculate() {
        let fac = facilities[activeMode];
        let raw = 0, net = 0, bonusTotal = 0; let names = new Set();
        fac.forEach(r => r.forEach(s => s.floors.forEach(fl => fl.forEach(m => {
            raw += m.power; 
            if(!names.has(m.name.toLowerCase())) { bonusTotal += m.bonus; names.add(m.name.toLowerCase()); }
        }))));
        fac.forEach(r => r.forEach(s => {
            let sRaw = 0; s.floors.forEach(fl => fl.forEach(m => sRaw += m.power));
            net += sRaw * (1 + (bonusTotal/100) + (s.bonus/100));
        }));
        document.getElementById('pPower').innerText = formatPower(raw);
        document.getElementById('pBonus').innerText = "%" + bonusTotal.toFixed(3);
        document.getElementById('pFinal').innerText = formatPower(net);
    }

    // --- Standart İşlemler (fac yerine facilities[activeMode] kullanılır) ---
    let currentRoom = 0;
    function toggleInv() { const w = document.getElementById('invWrapper'); w.style.display = w.style.display === 'block' ? 'none' : 'block'; }
    function addInv() {
        const n = document.getElementById('mName').value.trim();
        const p = parseFloat(document.getElementById('mPower').value);
        const b = parseFloat(document.getElementById('mBonus').value) || 0;
        const t = parseInt(document.getElementById('mType').value);
        if(!n || isNaN(p)) return;
        inventory.push({ id: Date.now(), name: n, power: p, bonus: b, size: t });
        save(); updateUI();
    }
    function updateUI() {
        document.getElementById('invList').innerHTML = inventory.map(m => `
            <div style="background:#1e1e3e; padding:6px; margin-bottom:4px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:10px;"><b>${m.name}</b><br>${formatPower(m.power)}</div>
                <button onclick="delInv(${m.id})" style="background:none; border:none; color:var(--danger); font-weight:bold;">×</button>
            </div>`).join('');
        document.getElementById('selMiner').innerHTML = inventory.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        document.getElementById('selShelf').innerHTML = facilities[activeMode][currentRoom].map((s, i) => `<option value="${i}">${s.name}</option>`).join('');
        renderNav();
    }
    function place() {
        if(activeMode !== 'manual') return alert("Otomatik modlarda manuel yerleştirme yapılamaz. Lütfen Manuel (✍️) moda geçin.");
        const s = document.getElementById('selShelf').value;
        const m = inventory.find(x => x.id == document.getElementById('selMiner').value);
        if(!m) return;
        let ok = false;
        let fac = facilities.manual[currentRoom][s];
        for(let f=0; f<4; f++) {
            let u = fac.floors[f].reduce((a, b) => a + b.size, 0);
            if(u + m.size <= 2) { fac.floors[f].push({...m, instId: Date.now()}); ok = true; break; }
        }
        if(!ok) alert("Dolu!");
        save(); render();
    }
    function render() {
        const v = document.getElementById('roomView'); v.innerHTML = "";
        facilities[activeMode][currentRoom].forEach((shelf, sIdx) => {
            let h = `<div class="shelf"><div class="shelf-title"><span>${shelf.name} (%${shelf.bonus.toFixed(3)})</span></div>`;
            shelf.floors.forEach((floor, fIdx) => {
                h += `<div class="floor">`;
                let used = 0;
                floor.forEach(m => {
                    used += m.size;
                    h += `<div class="slot ${m.size==2?'double':''}">
                            <span class="m-name-mini">${m.name}</span>
                            <button class="btn-remove-mini" onclick="removeM(${sIdx},${fIdx},${m.instId})">×</button>
                          </div>`;
                });
                for(let i=0; i<(2-used); i++) h += `<div class="slot" style="background:transparent;border:1px dashed #333"></div>`;
                h += `</div>`;
            });
            v.innerHTML += h + `</div>`;
        });
    }
    function renderNav() { document.getElementById('roomNav').innerHTML = roomSizes.map((_, i) => `<div class="room-btn ${currentRoom==i?'active':''}" onclick="setRoom(${i})">ODA ${i+1}</div>`).join(''); }
    function setRoom(i) { currentRoom = i; updateUI(); render(); }
    function removeM(s, f, id) { 
        if(activeMode !== 'manual') return alert("Otomatik modda düzenleme yapılamaz.");
        facilities.manual[currentRoom][s].floors[f] = facilities.manual[currentRoom][s].floors[f].filter(x => x.instId !== id); 
        save(); render(); 
    }
    function delInv(id) {
        if(confirm("Envanterden silinsin mi?")) {
            inventory = inventory.filter(x => x.id !== id);
            Object.values(facilities).forEach(f => f.forEach(r => r.forEach(s => s.floors.forEach((fl, idx) => {
                s.floors[idx] = fl.filter(m => m.id !== id);
            }))));
            save(); updateUI(); render();
        }
    }
    function resetAll() { if(confirm("Tüm veriler silinecek?")) { localStorage.clear(); location.reload(); } }

    switchMode('manual');
</script>
</body>
</html>
